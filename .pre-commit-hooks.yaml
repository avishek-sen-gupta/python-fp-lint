# --config is required and has no default, so every consumer must supply it:
#
#   - id: python-fp-lint
#     args: [--config, fp.json]
#
# Copy config.example.json from this repo as a starting point.
- id: python-fp-lint
  name: python-fp-lint
  description: FP lint gate — blocks any violation in a staged Python file
  entry: python-fp-lint precommit --strict
  language: python
  types: [python]
  pass_filenames: true
  require_serial: true
# On-demand variant: lints working-tree files rather than staged blobs, and
# never runs at commit. Run it with:
#
#   pre-commit run python-fp-lint-check --hook-stage manual --all-files
- id: python-fp-lint-check
  name: python-fp-lint (worktree)
  description: Lint working-tree Python files on demand; not part of the commit gate
  entry: python-fp-lint check --strict
  language: python
  types: [python]
  pass_filenames: true
  require_serial: true
  stages: [manual]
