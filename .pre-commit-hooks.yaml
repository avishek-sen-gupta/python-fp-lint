# --config is required and has no default, so every consumer must supply it:
#
#   - id: python-fp-lint
#     args: [--config, fp.json]
#
# Copy config.example.json from this repo as a starting point.
- id: python-fp-lint
  name: python-fp-lint
  description: FP lint gate — blocks any violation in a staged Python file
  entry: python-fp-lint precommit --strict
  language: python
  types: [python]
  pass_filenames: true
  require_serial: true
