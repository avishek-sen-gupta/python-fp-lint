id: no-weak-assert
language: python
rule:
  any:
    - pattern: assert $X is not None
    - pattern: assert len($X) > 0
    - pattern: assert len($X) >= 1
    - pattern: assert $X in $Y
    - pattern: assert not $X
    # A bare name, attribute or call as the condition. nthChild: 1 is the
    # condition; without it the failure message (`assert x == 0, result.stderr`)
    # matched too.
    - kind: assert_statement
      has:
        nthChild: 1
        any:
          - kind: identifier
          - kind: attribute
          - kind: call
message: "Weak assertion — assert a concrete expected value, not existence, containment, or truthiness"
severity: warning
